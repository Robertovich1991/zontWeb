name: Build Kiosk APK

# Compile un APK RELEASE signe de la borne kiosk sur un runner x86_64 (Ubuntu),
# le publie dans frontend/public/downloads/ (commit auto). Il ne reste qu'a Deploy.
# Lancement : onglet "Actions" -> "Build Kiosk APK" -> "Run workflow".
on:
  workflow_dispatch:
  push:
    paths:
      - 'kiosk-apk/**'

permissions:
  contents: write

env:
  KS_PASS: zontkiosk
  KS_ALIAS: kiosk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor deps & sync config
        working-directory: kiosk-apk
        run: |
          npm install
          npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: kiosk-apk/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Restore or create signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from repo secret."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/kiosk.jks
          else
            echo "No KEYSTORE_BASE64 secret -> generating a keystore (uploaded as artifact)."
            keytool -genkeypair -v -keystore /tmp/kiosk.jks \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ZONT Kiosk, O=ZONT, C=FR"
          fi

      - name: Zipalign & sign
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          UNSIGNED=$(find kiosk-apk/android/app/build/outputs/apk/release -name "*-release-unsigned.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/kiosk.jks \
            --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS \
            --ks-key-alias $KS_ALIAS --out zont-kiosk.apk /tmp/aligned.apk
          "$BT/apksigner" verify zont-kiosk.apk && echo "Signature OK"

      - name: Publish APK into frontend/public/downloads
        run: |
          mkdir -p frontend/public/downloads
          cp zont-kiosk.apk frontend/public/downloads/zont-kiosk.apk

      - name: Upload artifacts (APK + keystore)
        uses: actions/upload-artifact@v4
        with:
          name: zont-kiosk-apk
          path: |
            zont-kiosk.apk
            /tmp/kiosk.jks
          retention-days: 30

      - name: Commit updated APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/zont-kiosk.apk
          if git diff --staged --quiet; then
            echo "APK inchange, rien a committer."
          else
            git commit -m "chore(kiosk): build & publish signed kiosk APK [skip ci]"
            git push
            echo "APK publie dans frontend/public/downloads/zont-kiosk.apk"
          fi
